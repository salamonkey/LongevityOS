<!-- @dsCard group="Components" viewport="700x150" name="Icon (Lucide wrapper)" -->
<!doctype html><html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../../vitalis-ui.js"></script>
<style>html,body{margin:0}body{font-family:var(--font-sans);background:var(--surface-card);padding:22px;color:var(--text-primary)}.lbl{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);margin:0 0 10px}@keyframes v-fade{from{opacity:0}to{opacity:1}}@keyframes v-slide{from{transform:translateY(100%)}to{transform:translateY(0)}}</style>
</head><body><div id="root"></div>
<script>
(function(){
var h=React.createElement, useState=React.useState, UI;

function Demo(){
  var I=UI.Icon;
  return h('div',{style:{display:'flex',alignItems:'center',gap:20}},
    h(I,{name:'heart-pulse',size:28,color:'var(--color-primary)'}),
    h(I,{name:'syringe',size:28,color:'var(--color-secondary)'}),
    h(I,{name:'shield-check',size:28,color:'var(--status-done)'}),
    h(I,{name:'calendar',size:28,color:'var(--status-upcoming)'}),
    h(I,{name:'lock',size:28,color:'var(--slate-500)'}),
    h('span',{style:{fontSize:13,color:'var(--text-secondary)',marginLeft:8}},'Lucide · size & color props'));
}
function mount(){ if(!window.VitalisUI){return setTimeout(mount,30);} UI=window.VitalisUI; ReactDOM.createRoot(document.getElementById('root')).render(h(Demo)); setTimeout(function(){window.lucide&&window.lucide.createIcons();},60); }
mount();
})();
</script></body></html>
