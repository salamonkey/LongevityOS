<!-- @dsCard group="Components" viewport="700x300" name="Buttons & inputs" -->
<!doctype html><html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../../vitalis-ui.js"></script>
<style>html,body{margin:0}body{font-family:var(--font-sans);background:var(--surface-card);padding:22px;color:var(--text-primary)}.lbl{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);margin:0 0 10px}@keyframes v-fade{from{opacity:0}to{opacity:1}}@keyframes v-slide{from{transform:translateY(100%)}to{transform:translateY(0)}}</style>
</head><body><div id="root"></div>
<script>
(function(){
var h=React.createElement, useState=React.useState, UI;

function Demo(){
  var _v=useState(''), v=_v[0], setV=_v[1];
  var B=UI.Button, IB=UI.IconButton, In=UI.Input;
  return h('div',{style:{display:'flex',flexDirection:'column',gap:20,maxWidth:640}},
    h('div',null,
      h('p',{className:'lbl'},'Button · variants'),
      h('div',{style:{display:'flex',gap:10,flexWrap:'wrap',alignItems:'center'}},
        h(B,{variant:'primary',iconLeft:'plus'},'Eintragen'),
        h(B,{variant:'secondary'},'Später'),
        h(B,{variant:'ghost'},'Abbrechen'),
        h(B,{variant:'danger'},'Löschen'),
        h(B,{variant:'primary',disabled:true},'Deaktiviert'))),
    h('div',{style:{display:'flex',gap:24,alignItems:'flex-end',flexWrap:'wrap'}},
      h('div',null,h('p',{className:'lbl'},'Sizes'),h('div',{style:{display:'flex',gap:10,alignItems:'center'}},
        h(B,{size:'sm'},'Small'),h(B,{size:'md'},'Medium'),h(B,{size:'lg',iconRight:'chevron-right'},'Large'))),
      h('div',null,h('p',{className:'lbl'},'IconButton'),h('div',{style:{display:'flex',gap:10}},
        h(IB,{icon:'bell',variant:'soft',label:'a'}),h(IB,{icon:'plus',variant:'solid',label:'b'}),h(IB,{icon:'search',variant:'surface',label:'c'}),h(IB,{icon:'ellipsis',variant:'ghost',label:'d'})))),
    h('div',{style:{display:'flex',gap:16,maxWidth:560}},
      h(In,{label:'E-Mail',icon:'mail',placeholder:'anna@example.de',value:v,onChange:function(e){setV(e.target.value);},hint:'Wir senden dir Erinnerungen.',style:{flex:1}}),
      h(In,{label:'Geburtsdatum',icon:'calendar',error:'Bitte ausfüllen',style:{flex:1}})));
}
function mount(){ if(!window.VitalisUI){return setTimeout(mount,30);} UI=window.VitalisUI; ReactDOM.createRoot(document.getElementById('root')).render(h(Demo)); setTimeout(function(){window.lucide&&window.lucide.createIcons();},60); }
mount();
})();
</script></body></html>
