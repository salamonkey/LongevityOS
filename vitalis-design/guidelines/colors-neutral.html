<!-- @dsCard group="Colors" viewport="700x160" subtitle="Cool-tinted neutrals — never pure gray" name="Neutral slate" -->
<!doctype html><html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-sans);background:var(--surface-card);color:var(--text-primary);padding:20px 22px}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
  .sw{display:flex;flex-direction:column;gap:6px}
  .chip{border-radius:10px;border:1px solid rgba(30,42,54,.06)}
  .lab{font-size:11px;line-height:1.3;color:var(--text-secondary)}
  .lab b{display:block;color:var(--text-primary);font-weight:600}
  .mono{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
</style></head><body>
<div class="row">
  <div class="sw"><div class="chip" style="width:64px;height:52px;background:var(--slate-900)"></div><div class="lab"><b>900 · text</b><span class="mono">#1E2A36</span></div></div>
  <div class="sw"><div class="chip" style="width:64px;height:52px;background:var(--slate-700)"></div><div class="lab"><b>700</b><span class="mono">#3A4A58</span></div></div>
  <div class="sw"><div class="chip" style="width:64px;height:52px;background:var(--slate-500)"></div><div class="lab"><b>500 · 2nd text</b><span class="mono">#5B6B78</span></div></div>
  <div class="sw"><div class="chip" style="width:64px;height:52px;background:var(--slate-300)"></div><div class="lab"><b>300 · muted</b><span class="mono">#9AA8B3</span></div></div>
  <div class="sw"><div class="chip" style="width:64px;height:52px;background:var(--slate-100)"></div><div class="lab"><b>100 · border</b><span class="mono">#E3EAF0</span></div></div>
  <div class="sw"><div class="chip" style="width:64px;height:52px;background:var(--slate-50)"></div><div class="lab"><b>50 · app bg</b><span class="mono">#F5F8FA</span></div></div>
</div></body></html>
