<!-- @dsCard group="Colors" viewport="700x170" subtitle="Restrained semantic encoding" name="Status colors" -->
<!doctype html><html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-sans);background:var(--surface-card);color:var(--text-primary);padding:20px 22px}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
  .sw{display:flex;flex-direction:column;gap:6px}
  .chip{border-radius:10px;border:1px solid rgba(30,42,54,.06)}
  .lab{font-size:11px;line-height:1.3;color:var(--text-secondary)}
  .lab b{display:block;color:var(--text-primary);font-weight:600}
  .mono{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
</style></head><body>
<div class="row" style="gap:20px">
  <div class="sw"><div style="display:flex;align-items:center;gap:8px"><span class="chip" style="width:36px;height:36px;background:var(--status-due-soft)"></span><span class="chip" style="width:36px;height:36px;background:var(--status-due)"></span></div><div class="lab"><b>Fällig</b><span class="mono">blue</span></div></div>
  <div class="sw"><div style="display:flex;align-items:center;gap:8px"><span class="chip" style="width:36px;height:36px;background:var(--status-done-soft)"></span><span class="chip" style="width:36px;height:36px;background:var(--status-done)"></span></div><div class="lab"><b>Erledigt</b><span class="mono">green</span></div></div>
  <div class="sw"><div style="display:flex;align-items:center;gap:8px"><span class="chip" style="width:36px;height:36px;background:var(--status-upcoming-soft)"></span><span class="chip" style="width:36px;height:36px;background:var(--status-upcoming)"></span></div><div class="lab"><b>Demnächst</b><span class="mono">amber</span></div></div>
  <div class="sw"><div style="display:flex;align-items:center;gap:8px"><span class="chip" style="width:36px;height:36px;background:var(--status-overdue-soft)"></span><span class="chip" style="width:36px;height:36px;background:var(--status-overdue)"></span></div><div class="lab"><b>Überfällig</b><span class="mono">red</span></div></div>
</div></body></html>
