<!-- @dsCard group="Brand" viewport="700x180" subtitle="Lucide line icons in soft chips" name="Iconography" -->
<!doctype html><html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  html,body{margin:0}
  body{font-family:var(--font-sans);background:var(--surface-card);color:var(--text-primary);padding:20px 22px}
  .grid{display:flex;gap:14px;flex-wrap:wrap}
  .ic{width:52px;height:52px;border-radius:13px;background:var(--color-primary-soft);color:var(--color-primary);display:flex;align-items:center;justify-content:center}
  .ic svg{width:24px;height:24px;stroke-width:1.75}
  .lab{font-size:12px;color:var(--text-secondary);margin-top:14px}
</style></head><body>
<div class="grid">
  <div class="ic"><i data-lucide="layout-grid"></i></div>
  <div class="ic"><i data-lucide="syringe"></i></div>
  <div class="ic"><i data-lucide="shield-check"></i></div>
  <div class="ic"><i data-lucide="calendar"></i></div>
  <div class="ic"><i data-lucide="lock"></i></div>
  <div class="ic"><i data-lucide="bell"></i></div>
  <div class="ic"><i data-lucide="file-text"></i></div>
  <div class="ic"><i data-lucide="heart-pulse"></i></div>
  <div class="ic"><i data-lucide="plus"></i></div>
  <div class="ic"><i data-lucide="chevron-right"></i></div>
</div>
<div class="lab">Lucide · 1.75px stroke, rounded joins · glyphs sit in a soft-tinted rounded chip</div>
<script>lucide.createIcons();</script>
</body></html>
