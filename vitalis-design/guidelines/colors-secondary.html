<!-- @dsCard group="Colors" viewport="700x150" subtitle="Supporting accent — used sparingly" name="Secondary teal" -->
<!doctype html><html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-sans);background:var(--surface-card);color:var(--text-primary);padding:20px 22px}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
  .sw{display:flex;flex-direction:column;gap:6px}
  .chip{border-radius:10px;border:1px solid rgba(30,42,54,.06)}
  .lab{font-size:11px;line-height:1.3;color:var(--text-secondary)}
  .lab b{display:block;color:var(--text-primary);font-weight:600}
  .mono{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
</style></head><body>
<div class="row">
  <div class="sw"><div class="chip" style="width:64px;height:52px;background:var(--teal-100)"></div><div class="lab"><b>100</b><span class="mono">#E7F3F1</span></div></div>
  <div class="sw"><div class="chip" style="width:64px;height:52px;background:var(--teal-300)"></div><div class="lab"><b>300</b><span class="mono">#8FCFC9</span></div></div>
  <div class="sw"><div class="chip" style="width:64px;height:52px;background:var(--teal-500)"></div><div class="lab"><b>500 · accent</b><span class="mono">#2FA39C</span></div></div>
  <div class="sw"><div class="chip" style="width:64px;height:52px;background:var(--teal-600)"></div><div class="lab"><b>600</b><span class="mono">#268A84</span></div></div>
</div></body></html>
