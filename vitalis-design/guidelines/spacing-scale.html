<!-- @dsCard group="Spacing" viewport="700x160" subtitle="4px base grid" name="Spacing scale" -->
<!doctype html><html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-sans);background:var(--surface-card);color:var(--text-primary);padding:20px 22px}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
  .sw{display:flex;flex-direction:column;gap:6px}
  .chip{border-radius:10px;border:1px solid rgba(30,42,54,.06)}
  .lab{font-size:11px;line-height:1.3;color:var(--text-secondary)}
  .lab b{display:block;color:var(--text-primary);font-weight:600}
  .mono{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
</style></head><body>
<div class="row" style="align-items:flex-start;gap:16px">
  <div class="sw" style="align-items:center"><div style="width:4px;height:22px;background:var(--color-primary);border-radius:3px"></div><div class="lab" style="text-align:center"><b>1</b><span class="mono">4px</span></div></div><div class="sw" style="align-items:center"><div style="width:8px;height:22px;background:var(--color-primary);border-radius:3px"></div><div class="lab" style="text-align:center"><b>2</b><span class="mono">8px</span></div></div><div class="sw" style="align-items:center"><div style="width:12px;height:22px;background:var(--color-primary);border-radius:3px"></div><div class="lab" style="text-align:center"><b>3</b><span class="mono">12px</span></div></div><div class="sw" style="align-items:center"><div style="width:16px;height:22px;background:var(--color-primary);border-radius:3px"></div><div class="lab" style="text-align:center"><b>4</b><span class="mono">16px</span></div></div><div class="sw" style="align-items:center"><div style="width:20px;height:22px;background:var(--color-primary);border-radius:3px"></div><div class="lab" style="text-align:center"><b>5</b><span class="mono">20px</span></div></div><div class="sw" style="align-items:center"><div style="width:24px;height:22px;background:var(--color-primary);border-radius:3px"></div><div class="lab" style="text-align:center"><b>6</b><span class="mono">24px</span></div></div><div class="sw" style="align-items:center"><div style="width:32px;height:22px;background:var(--color-primary);border-radius:3px"></div><div class="lab" style="text-align:center"><b>8</b><span class="mono">32px</span></div></div><div class="sw" style="align-items:center"><div style="width:40px;height:22px;background:var(--color-primary);border-radius:3px"></div><div class="lab" style="text-align:center"><b>10</b><span class="mono">40px</span></div></div><div class="sw" style="align-items:center"><div style="width:48px;height:22px;background:var(--color-primary);border-radius:3px"></div><div class="lab" style="text-align:center"><b>12</b><span class="mono">48px</span></div></div>
</div></body></html>
