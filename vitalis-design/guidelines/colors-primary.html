<!-- @dsCard group="Colors" viewport="700x150" subtitle="Brand blue ramp · 600 is primary" name="Primary blue" -->
<!doctype html><html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-sans);background:var(--surface-card);color:var(--text-primary);padding:20px 22px}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
  .sw{display:flex;flex-direction:column;gap:6px}
  .chip{border-radius:10px;border:1px solid rgba(30,42,54,.06)}
  .lab{font-size:11px;line-height:1.3;color:var(--text-secondary)}
  .lab b{display:block;color:var(--text-primary);font-weight:600}
  .mono{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
</style></head><body>
<div class="row">
  <div class="sw"><div class="chip" style="width:64px;height:52px;background:var(--blue-50)"></div><div class="lab"><b>50</b><span class="mono">#F5F8FA</span></div></div>
  <div class="sw"><div class="chip" style="width:64px;height:52px;background:var(--blue-100)"></div><div class="lab"><b>100</b><span class="mono">#EAF1F6</span></div></div>
  <div class="sw"><div class="chip" style="width:64px;height:52px;background:var(--blue-300)"></div><div class="lab"><b>300</b><span class="mono">#9CC1DA</span></div></div>
  <div class="sw"><div class="chip" style="width:64px;height:52px;background:var(--blue-500)"></div><div class="lab"><b>500</b><span class="mono">#3A8ABE</span></div></div>
  <div class="sw"><div class="chip" style="width:64px;height:52px;background:var(--blue-600)"></div><div class="lab"><b>600 ·  primary</b><span class="mono">#2B7FB8</span></div></div>
  <div class="sw"><div class="chip" style="width:64px;height:52px;background:var(--blue-700)"></div><div class="lab"><b>700</b><span class="mono">#1F5E8A</span></div></div>
  <div class="sw"><div class="chip" style="width:64px;height:52px;background:var(--blue-800)"></div><div class="lab"><b>800</b><span class="mono">#184B6E</span></div></div>
</div></body></html>
