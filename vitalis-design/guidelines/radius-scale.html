<!-- @dsCard group="Spacing" viewport="700x160" subtitle="Soft, consistent curvature" name="Corner radius" -->
<!doctype html><html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-sans);background:var(--surface-card);color:var(--text-primary);padding:20px 22px}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
  .sw{display:flex;flex-direction:column;gap:6px}
  .chip{border-radius:10px;border:1px solid rgba(30,42,54,.06)}
  .lab{font-size:11px;line-height:1.3;color:var(--text-secondary)}
  .lab b{display:block;color:var(--text-primary);font-weight:600}
  .mono{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
</style></head><body>
<div class="row" style="gap:18px">
  <div class="sw" style="align-items:center"><div style="width:56px;height:44px;background:var(--color-primary-soft);border:1.5px solid var(--color-primary);border-radius:7px"></div><div class="lab" style="text-align:center"><b>xs</b><span class="mono">7px</span></div></div><div class="sw" style="align-items:center"><div style="width:56px;height:44px;background:var(--color-primary-soft);border:1.5px solid var(--color-primary);border-radius:11px"></div><div class="lab" style="text-align:center"><b>sm</b><span class="mono">11px</span></div></div><div class="sw" style="align-items:center"><div style="width:56px;height:44px;background:var(--color-primary-soft);border:1.5px solid var(--color-primary);border-radius:14px"></div><div class="lab" style="text-align:center"><b>md · rows</b><span class="mono">14px</span></div></div><div class="sw" style="align-items:center"><div style="width:56px;height:44px;background:var(--color-primary-soft);border:1.5px solid var(--color-primary);border-radius:16px"></div><div class="lab" style="text-align:center"><b>lg · cards</b><span class="mono">16px</span></div></div><div class="sw" style="align-items:center"><div style="width:56px;height:44px;background:var(--color-primary-soft);border:1.5px solid var(--color-primary);border-radius:22px"></div><div class="lab" style="text-align:center"><b>xl</b><span class="mono">22px</span></div></div><div class="sw" style="align-items:center"><div style="width:56px;height:44px;background:var(--color-primary-soft);border:1.5px solid var(--color-primary);border-radius:28px"></div><div class="lab" style="text-align:center"><b>2xl · sheets</b><span class="mono">28px</span></div></div>
</div></body></html>
