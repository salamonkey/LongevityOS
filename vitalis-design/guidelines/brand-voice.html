<!doctype html><html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-sans);background:var(--surface-card);color:var(--text-primary);padding:20px 22px}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
  .sw{display:flex;flex-direction:column;gap:6px}
  .chip{border-radius:10px;border:1px solid rgba(30,42,54,.06)}
  .lab{font-size:11px;line-height:1.3;color:var(--text-secondary)}
  .lab b{display:block;color:var(--text-primary);font-weight:600}
  .mono{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
</style></head><body>
<div style="display:flex;flex-direction:column;gap:10px">
  <div style="font-size:17px;font-weight:600">„Schön, dass du da bist."</div>
  <div class="lab" style="font-size:12.5px;max-width:560px;line-height:1.6">Warm, informal <b>du</b>-address. Reassuring and low-pressure — Vitalis nudges, never nags. Plain German, sentence case, no emoji. It <b>organizes</b> prevention (erinnern, erfassen, zuordnen); it never diagnoses.</div>
  <div class="row" style="gap:8px;margin-top:4px">
    <span style="background:var(--status-due-soft);color:var(--color-primary-ink);font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px">Fällig</span>
    <span style="background:var(--status-upcoming-soft);color:#9a6a1c;font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px">Demnächst</span>
    <span style="background:var(--status-done-soft);color:#1d6b48;font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px">Erledigt</span>
  </div>
</div></body></html>
