<!-- @dsCard group="Brand" viewport="700x430" subtitle="Vitalis mark — soft shield holding the Vorsorge-Ring (dir. 2a)" name="Logo" -->
<!doctype html><html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-sans);background:var(--surface-card);color:var(--text-primary);padding:24px 26px;display:flex;flex-direction:column;gap:22px}
  .row{display:flex;gap:26px;flex-wrap:wrap;align-items:center}
  .lockup{display:flex;align-items:center;gap:16px}
  .word{font-size:44px;font-weight:700;letter-spacing:-.025em;color:var(--slate-900)}
  .tile{width:66px;height:66px;border-radius:16px;background:var(--color-primary);display:inline-flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(43,127,184,.28)}
  .cell{display:flex;flex-direction:column;align-items:center;gap:9px}
  .swatch{border:1px solid var(--border-subtle);border-radius:14px;padding:20px 24px;display:flex;align-items:center;justify-content:center;min-width:96px}
  .swatch.dark{background:var(--slate-900);border-color:var(--slate-900)}
  .lab{font-size:11px;line-height:1.3;color:var(--text-secondary)}
  .lab b{display:block;color:var(--text-primary);font-weight:600}
  .divider{height:1px;background:var(--border-subtle)}
  .scale{display:flex;align-items:flex-end;gap:18px}
</style></head><body>

<div class="row">
  <div class="lockup">
    <img src="logo/vitalis-mark.svg" width="60" height="60" alt="Vitalis Schild">
    <span class="word">Vitalis</span>
  </div>
  <div class="lab" style="max-width:250px">Primäre Wortmarke. Schild = Schutz &amp; Vorsorge, mit dem Vorsorge-Ring im Zentrum. Kein Kreuz — Vitalis organisiert, behandelt nicht.</div>
</div>

<div class="divider"></div>

<div class="row">
  <div class="cell">
    <div class="swatch"><img src="logo/vitalis-mark.svg" width="46" height="46" alt="Symbol"></div>
    <span class="lab"><b>Symbol</b>primär</span>
  </div>
  <div class="cell">
    <div class="swatch"><img src="logo/vitalis-appicon.svg" width="56" height="56" alt="App-Icon"></div>
    <span class="lab"><b>App-Icon</b>gerundetes Kachel</span>
  </div>
  <div class="cell">
    <div class="swatch"><img src="logo/vitalis-mark-mono.svg" width="46" height="46" alt="Mono"></div>
    <span class="lab"><b>Mono</b>dunkel</span>
  </div>
  <div class="cell">
    <div class="swatch dark"><img src="logo/vitalis-mark-reversed.svg" width="46" height="46" alt="Negativ"></div>
    <span class="lab"><b>Negativ</b>auf dunkel</span>
  </div>
  <div class="cell">
    <div class="scale">
      <img src="logo/vitalis-mark.svg" width="40" height="40" alt="">
      <img src="logo/vitalis-mark.svg" width="26" height="26" alt="">
      <img src="logo/vitalis-mark.svg" width="18" height="18" alt="">
      <img src="logo/vitalis-mark.svg" width="12" height="12" alt="">
    </div>
    <span class="lab"><b>Skaliert</b>bis Favicon</span>
  </div>
</div>

</body></html>
