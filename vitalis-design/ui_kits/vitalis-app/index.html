  .phone{width:390px;height:820px;background:#0f1720;border-radius:46px;padding:10px;box-shadow:0 30px 70px rgba(30,42,54,.28);flex:none}
  .screen{position:relative;width:100%;height:100%;background:var(--surface-app);border-radius:36px;overflow:hidden;display:flex;flex-direction:column}
  .statusbar{display:flex;justify-content:space-between;align-items:center;padding:12px 24px 4px;font-size:12px;font-weight:600;color:var(--text-primary);flex:none}
  .statusbar .r{display:flex;gap:5px;align-items:center}
  .content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .content::-webkit-scrollbar{width:0}
  .pad{padding:8px 20px 24px}
  .sec-label{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);margin:20px 2px 10px}
  .rows{display:flex;flex-direction:column;gap:10px}
  .h1{font-size:26px;font-weight:700;color:var(--text-primary);letter-spacing:-.01em;line-height:1.1}
  .fab{position:absolute;right:18px;bottom:calc(var(--tabbar-h) + 16px);z-index:20}
  .chiprow{display:flex;gap:8px;flex-wrap:wrap}
  .seg{display:flex;background:var(--surface-sunken);border-radius:var(--radius-full);padding:4px;gap:4px}
  .seg button{flex:1;border:none;background:none;font-family:var(--font-sans);font-size:14px;font-weight:600;padding:9px 0;border-radius:var(--radius-full);cursor:pointer;color:var(--text-secondary)}
  .seg button.on{background:var(--surface-card);color:var(--color-primary-ink);box-shadow:var(--shadow-sm)}
  .dots{display:flex;gap:6px;justify-content:center}
  .dots span{width:7px;height:7px;border-radius:999px;background:var(--slate-200)}
  .dots span.on{width:20px;background:var(--color-primary)}
  @keyframes v-fade{from{opacity:0}to{opacity:1}}
  @keyframes v-slide{from{transform:translateY(100%)}to{transform:translateY(0)}}
  @keyframes v-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  @keyframes v-ping{0%{transform:scale(1);opacity:.55}70%,100%{transform:scale(2.3);opacity:0}}
  @keyframes v-slidein{from{transform:translateX(100%)}to{transform:translateX(0)}}
  @keyframes v-halo{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.5);opacity:0}}
  @keyframes v-draw{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  @keyframes v-dot{from{transform:translate(-50%,-50%) scale(0);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
  .anim{animation:v-up .28s ease both}
  a{color:var(--color-primary)}a:hover{color:var(--color-primary-hover)}
</style>
